name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t cicd-node-app .

    - name: Run Tests
      run: docker run cicd-node-app npm test

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop cicd-node-app || true
          docker rm cicd-node-app || true
          docker rmi cicd-node-app || true
          docker build -t cicd-node-app .
          docker run -d -p 3000:3000 --name cicd-node-app cicd-node-app